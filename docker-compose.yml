services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: local_teacher_qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: local_teacher_ollama
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis/redis-stack-server:latest
    container_name: local_teacher_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_storage:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: curlimages/curl:latest
    container_name: local_teacher_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c " echo '\nDescargando deepseek-r1:8b...' && \
      curl -sf -X POST http://ollama:11434/api/pull -d '{\"name\": \"deepseek-r1:8b\"}' && \
      echo '\nDescargando llama3.2...' && \
      curl -sf -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.2\"}' && \
      echo '\nDescargando granite-embedding:278m...' && \
      curl -sf -X POST http://ollama:11434/api/pull -d '{\"name\": \"granite-embedding:278m\"}' && \
      echo '\nDescargando granite3-guardian:2b...' && \
      curl -sf -X POST http://ollama:11434/api/pull -d '{\"name\": \"granite3-guardian:2b\"}' && \
      echo '\n¡Modelos descargados exitosamente!' "

  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: local_teacher_memgraph
    ports:
      - '7687:7687'
    environment:
      - MEMGRAPH="--log-level=WARNING"
    volumes:
      - memgraph_storage:/var/lib/memgraph
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  memgraph-lab:
    image: memgraph/lab:latest
    container_name: local_teacher_memgraph_lab
    ports:
      - '3000:3000'
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      - memgraph
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_storage:
  redis_storage:
  memgraph_storage:

networks:
  default:
    name: local_teacher_network
